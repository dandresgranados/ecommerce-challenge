<section class="page-header">
  <div>
    <h1>Categorías</h1>
    <p class="subtitle">{{ categories().length }} categoría(s) registrada(s)</p>
  </div>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Nueva categoría
  </button>
</section>

<mat-card class="table-card">
  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <div class="table-scroll">
    <table mat-table [dataSource]="categories()" class="cats-table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let c">{{ c.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c">
          <strong>{{ c.name }}</strong>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Descripción</th>
        <td mat-cell *matCellDef="let c">
          {{ c.description || '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="right">Acciones</th>
        <td mat-cell *matCellDef="let c" class="right">
          <button mat-icon-button (click)="openEdit(c)" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button
            mat-icon-button
            color="warn"
            (click)="confirmDelete(c)"
            matTooltip="Eliminar"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr *matNoDataRow>
        <td [attr.colspan]="displayedColumns.length" class="no-data">
          @if (loading()) {
            <span>Cargando...</span>
          } @else {
            <span>No hay categorías registradas.</span>
          }
        </td>
      </tr>
    </table>
  </div>
</mat-card>

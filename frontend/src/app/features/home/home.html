<section class="hero">
  <h1>
    Bienvenido{{
      auth.currentUser()?.fullName ? ', ' + auth.currentUser()?.fullName : ''
    }}
  </h1>
  <p class="hero-subtitle">
    Panel principal · Roles: {{ auth.currentUser()?.roles?.join(' · ') }}
  </p>
</section>

<section class="tiles-grid">
  @for (tile of tiles(); track tile.route) {
    <a [routerLink]="tile.route" class="tile-link">
      <mat-card class="tile" [class.tile-admin]="tile.color === 'accent'">
        <mat-card-content>
          <mat-icon class="tile-icon">{{ tile.icon }}</mat-icon>
          <h3 class="tile-title">{{ tile.title }}</h3>
          <p class="tile-description">{{ tile.description }}</p>
        </mat-card-content>
      </mat-card>
    </a>
  }
</section>

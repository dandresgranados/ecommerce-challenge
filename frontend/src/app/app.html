@if (showToolbar()) {
  <mat-toolbar color="primary">
    <a routerLink="/" class="toolbar-brand">
      <mat-icon>storefront</mat-icon>
      <span class="toolbar-title">{{ title() }}</span>
    </a>
    <span class="toolbar-spacer"></span>

    @if (auth.isAuthenticated()) {
      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        {{ auth.currentUser()?.username }}
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-header">
          <div class="menu-name">{{ auth.currentUser()?.fullName || auth.currentUser()?.username }}</div>
          <div class="menu-email">{{ auth.currentUser()?.email }}</div>
          <div class="menu-roles">{{ auth.currentUser()?.roles?.join(' · ') }}</div>
        </div>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    } @else {
      <a mat-button routerLink="/login">
        <mat-icon>login</mat-icon>
        Iniciar sesión
      </a>
    }
  </mat-toolbar>
}

<router-outlet />

<mat-sidenav-container class="layout-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpen()"
    (openedChange)="sidenavOpen.set($event)"
    class="layout-sidenav"
  >
    <div class="sidenav-header">
      <mat-icon>storefront</mat-icon>
      <span>TGS E-commerce</span>
    </div>
    <mat-divider></mat-divider>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="layout-content">
    <mat-toolbar color="primary" class="layout-toolbar">
      <button
        mat-icon-button
        (click)="toggleSidenav()"
        aria-label="Abrir/cerrar menú"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">TGS E-commerce</span>
      <span class="toolbar-spacer"></span>

      <a
        mat-icon-button
        routerLink="/checkout"
        [matBadge]="cart.itemCount()"
        [matBadgeHidden]="cart.isEmpty()"
        matBadgeColor="accent"
        matBadgeSize="small"
        matBadgeOverlap="true"
        aria-label="Ver carrito"
      >
        <mat-icon>shopping_cart</mat-icon>
      </a>

      <button mat-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
        {{ auth.currentUser()?.username }}
        <mat-icon>arrow_drop_down</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <div class="menu-header">
          <div class="menu-name">
            {{ auth.currentUser()?.fullName || auth.currentUser()?.username }}
          </div>
          <div class="menu-email">{{ auth.currentUser()?.email }}</div>
          <div class="menu-roles">{{ auth.currentUser()?.roles?.join(' · ') }}</div>
        </div>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="layout-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

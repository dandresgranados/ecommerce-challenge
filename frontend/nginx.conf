# Configuración de nginx para servir la SPA de Angular y proxyar /api al backend.

server {
    listen       80;
    server_name  _;

    # Raíz donde el Dockerfile copia el build de Angular.
    root         /usr/share/nginx/html;
    index        index.html;

    # Compresión gzip básica.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/vnd.ms-fontobject application/x-font-ttf font/opentype
               image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------
    # Proxy /api → backend (nombre del servicio en docker-compose).
    # Mantiene el prefijo /api al reenviar (el backend expone /api/**).
    # ------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets con hash → cacheables por mucho tiempo (Angular añade hashes al nombre).
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html nunca se cachea — para que las nuevas versiones lleguen inmediatamente.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: cualquier ruta desconocida devuelve index.html
    # para que el router de Angular decida qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =====================================================================
# Perfil PROD — producción con PostgreSQL.
# Todos los valores sensibles vienen por variable de entorno.
# Se activa con: SPRING_PROFILES_ACTIVE=prod
# =====================================================================
spring:
  datasource:
    # docker-compose expondrá el host "postgres" (nombre del servicio).
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/ecommerce}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:ecommerce}
    password: ${DATABASE_PASSWORD:changeme}
    hikari:
      # Tamaño del pool de conexiones. HikariCP es el default en Spring Boot.
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # update = Hibernate crea/actualiza el schema al arrancar en base a
      # las @Entity. Aceptable para el alcance de esta prueba técnica
      # (en un proyecto real se usaría Flyway o Liquibase para versionar
      # las migraciones y hacer un ddl-auto: validate).
      ddl-auto: update
    show-sql: false
    # Ejecuta data.sql DESPUÉS de que Hibernate cree las tablas.
    # Necesario porque DataInitializer depende de los roles insertados por data.sql.
    defer-datasource-initialization: true
    properties:
      hibernate:
        # Asegura que Hibernate serialice/deserialize fechas siempre en UTC,
        # independientemente de la zona horaria del contenedor.
        jdbc.time_zone: UTC

  # Sin consola H2 en prod. data.sql se ejecuta para insertar los roles base
  # (ADMIN/USER) que necesita DataInitializer al arrancar por primera vez.
  # Los INSERT del script solo corren si la tabla está vacía en el primer
  # arranque (ddl-auto: update no recrea tablas), así que es idempotente.
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      encoding: UTF-8
      # No aborta si un INSERT falla por PK duplicada (útil si el volumen
      # ya trae datos de un arranque previo).
      continue-on-error: true

logging:
  level:
    root: INFO
    com.tgs.ecommerce: INFO
    org.hibernate.SQL: WARN
